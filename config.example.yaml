# ZCode Universal Model Gateway - example configuration.
#
# Copy this file to config.yaml and adjust as needed. API keys never go here:
# each provider names an environment variable via api_key_env, and the real
# key is read from that environment variable.

settings:
  # alias: a @level suffix on the model name always wins over any reasoning
  # parameter the client sends in the request body.
  # client: the client request body takes precedence.
  reasoning_precedence: alias
  log_capacity: 500
  log_page_size: 100

providers:

  provider_responses:
    display_name: Responses Provider
    protocol: openai_responses
    base_url: https://example.com/v1
    api_key_env: PROVIDER_RESPONSES_KEY
    timeout: 600

  provider_chat:
    display_name: Chat Provider
    protocol: openai_chat
    base_url: https://example.com/v1
    api_key_env: PROVIDER_CHAT_KEY
    timeout: 600

  provider_anthropic:
    display_name: Anthropic Provider
    protocol: anthropic_messages
    base_url: https://example.com
    api_key_env: ANTHROPIC_API_KEY
    timeout: 600

models:

  reasoning-model:
    display_name: Example Reasoning Model
    provider: provider_responses
    upstream_model: actual-model-id
    enabled: true
    reasoning:
      supported:
        - off
        - low
        - high
        - max
      default: high
      mapping:
        off:
          reasoning:
            effort: none
        low:
          reasoning:
            effort: low
        high:
          reasoning:
            effort: high
        max:
          reasoning:
            effort: max

  normal-model:
    display_name: Example Plain Model
    provider: provider_chat
    upstream_model: model-without-reasoning
    enabled: true

  claude-model:
    display_name: Example Claude Model
    provider: provider_anthropic
    upstream_model: claude-3-5-sonnet-latest
    enabled: true
    reasoning:
      supported:
        - off
        - low
        - high
      default: high
      mapping:
        off:
          thinking:
            type: disabled
        low:
          thinking:
            type: enabled
            budget_tokens: 4000
        high:
          thinking:
            type: enabled
            budget_tokens: 16000
